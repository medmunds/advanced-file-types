dialog.pattern.label=Pattern:
dialog.pattern.help=<html>\
  <b>Glob patterns</b>\
  <ul>\
  <li><code>*</code> – Matches characters within a single directory</li>\
  <li><code>**</code> – Matches subdirectories recursively</li>\
  <li><code>?</code> – Matches any single character</li>\
  <li><code>{a,b}</code> – Matches 'a' or 'b' (e.g. <code>*.{txt,md}</code>)</li>\
  <li><code>[abc]</code>, <code>[!abc]</code> – Character class / negated class</li>\
  <li>Patterns without <code>/</code> match filename anywhere; patterns with <code>/</code> match project-relative path</li>\
  </ul>\
  <b>Regex patterns</b>\
  <ul>\
  <li>Match the full project-relative path</li>\
  <li>Use <code>.*</code> for substring / directory wildcards (e.g. <code>docs/.*\.txt</code>)</li>\
  </ul>\
  All patterns are case-insensitive\
  </html>
