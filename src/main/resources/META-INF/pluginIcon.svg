<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="paint0_linear" x1="12.3" y1="15.3" x2="37.7" y2="27.7" gradientUnits="userSpaceOnUse">
            <stop offset="0.15937" stop-color="#3BEA62"/>
            <stop offset="0.5404" stop-color="#3C99CC"/>
            <stop offset="0.93739" stop-color="#6B57FF"/>
        </linearGradient>
        <mask id="bottom-file-mask">
            <rect width="40" height="40" fill="white"/>
            <!-- Cutout top file plus 1px gap clearance (stroke-width="4" = 2px path stroke + 2*1px gap) -->
            <path d="M 10 4 H 21 L 27 10 V 29 A 2 2 0 0 1 25 31 H 10 A 2 2 0 0 1 8 29 V 6 A 2 2 0 0 1 10 4 Z" fill="black" stroke="black" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
        </mask>
        <mask id="files-asterisk-clip-mask">
            <rect width="40" height="40" fill="white"/>
            <!-- Clearance cutouts around the two horizontally aligned asterisks (clearance = 2px) -->
            <!-- Left asterisk cutout (cx=18.5, cy=21.5, r=6.2, bar_w=2.8) -->
            <rect x="10.3" y="18.1" width="16.4" height="6.8" rx="3.4" transform="rotate(0 18.5 21.5)" fill="black"/>
            <rect x="10.3" y="18.1" width="16.4" height="6.8" rx="3.4" transform="rotate(60 18.5 21.5)" fill="black"/>
            <rect x="10.3" y="18.1" width="16.4" height="6.8" rx="3.4" transform="rotate(120 18.5 21.5)" fill="black"/>
            <!-- Right asterisk cutout (cx=31.5, cy=21.5, r=6.2, bar_w=2.8) -->
            <rect x="23.3" y="18.1" width="16.4" height="6.8" rx="3.4" transform="rotate(0 31.5 21.5)" fill="black"/>
            <rect x="23.3" y="18.1" width="16.4" height="6.8" rx="3.4" transform="rotate(60 31.5 21.5)" fill="black"/>
            <rect x="23.3" y="18.1" width="16.4" height="6.8" rx="3.4" transform="rotate(120 31.5 21.5)" fill="black"/>
        </mask>
    </defs>

    <!-- Stacked file outlines clipped to not touch asterisks -->
    <g mask="url(#files-asterisk-clip-mask)">
        <!-- Bottom file outline (stacked below and offset to the left and bottom, clipped with 1px gap from top file) -->
        <g mask="url(#bottom-file-mask)">
            <path d="M 5 9 H 16 L 22 15 V 34 A 2 2 0 0 1 20 36 H 5 A 2 2 0 0 1 3 34 V 11 A 2 2 0 0 1 5 9 Z" stroke="#9AA0B0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M 16 9 V 15 H 22" stroke="#9AA0B0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        </g>

        <!-- Top file outline with dogeared corner and rounded corners -->
        <g>
            <path d="M 10 4 H 21 L 27 10 V 29 A 2 2 0 0 1 25 31 H 10 A 2 2 0 0 1 8 29 V 6 A 2 2 0 0 1 10 4 Z" stroke="#6C707E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M 21 4 V 10 H 27" stroke="#6C707E" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        </g>
    </g>

    <!-- Two globbing asterisks (**) horizontally aligned with gradient -->
    <g id="asterisks" fill="url(#paint0_linear)">
        <!-- Left asterisk -->
        <rect x="12.3" y="20.1" width="12.4" height="2.8" rx="1.4" transform="rotate(0 18.5 21.5)"/>
        <rect x="12.3" y="20.1" width="12.4" height="2.8" rx="1.4" transform="rotate(60 18.5 21.5)"/>
        <rect x="12.3" y="20.1" width="12.4" height="2.8" rx="1.4" transform="rotate(120 18.5 21.5)"/>
        <!-- Right asterisk (breaking through the right border) -->
        <rect x="25.3" y="20.1" width="12.4" height="2.8" rx="1.4" transform="rotate(0 31.5 21.5)"/>
        <rect x="25.3" y="20.1" width="12.4" height="2.8" rx="1.4" transform="rotate(60 31.5 21.5)"/>
        <rect x="25.3" y="20.1" width="12.4" height="2.8" rx="1.4" transform="rotate(120 31.5 21.5)"/>
    </g>
</svg>
